# Release: push a tag like v1.0.0 and this builds, checksums, attests, and
# publishes a GitHub Release. Verify a download with:
#   gh attestation verify <zip> -R williajm/eq2_lfg
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Full history + tags so MinVer derives the version from the pushed tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/Eq2Lfg.Core.Tests --configuration Release

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/Eq2Lfg.App -c Release -o publish/fdd
          -p:ContinuousIntegrationBuild=true

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/Eq2Lfg.App -c Release -r win-x64 --self-contained true
          -o publish/sc -p:ContinuousIntegrationBuild=true

      - name: Package
        shell: pwsh
        # Tag name via env, never interpolated into the script (injection hygiene).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path publish/fdd/* -DestinationPath "Eq2Lfg-$env:TAG-win-framework-dependent.zip"
          Compress-Archive -Path publish/sc/* -DestinationPath "Eq2Lfg-$env:TAG-win-x64-self-contained.zip"
          Get-FileHash *.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      # Signed SLSA provenance linking each zip to this workflow run and commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "*.zip"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" *.zip SHA256SUMS.txt
          --generate-notes --verify-tag
