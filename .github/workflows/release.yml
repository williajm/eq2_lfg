# Release: push a tag like v1.0.0 and this builds, checksums, attests, and
# publishes a GitHub Release. Verify a download with:
#   gh attestation verify <zip> -R williajm/eq2_lfg
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Full history + tags so MinVer derives the version from the pushed tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/Eq2Lfg.Core.Tests --configuration Release

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/Eq2Lfg.App -c Release -o publish/fdd
          -p:ContinuousIntegrationBuild=true

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/Eq2Lfg.App -c Release -r win-x64 --self-contained true
          -o publish/sc -p:ContinuousIntegrationBuild=true

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive -Path publish/fdd/* -DestinationPath "Eq2Lfg-$v-win-framework-dependent.zip"
          Compress-Archive -Path publish/sc/* -DestinationPath "Eq2Lfg-$v-win-x64-self-contained.zip"
          Get-FileHash *.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      # Signed SLSA provenance linking each zip to this workflow run and commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.zip"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" *.zip SHA256SUMS.txt
          --generate-notes --verify-tag
