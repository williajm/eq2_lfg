name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Eq2Lfg.sln

      - name: Check formatting
        run: dotnet format Eq2Lfg.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Eq2Lfg.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Eq2Lfg.Core.Tests --configuration Release --no-build --verbosity normal
