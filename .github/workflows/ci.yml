name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Eq2Lfg.sln

      - name: Check formatting
        run: dotnet format Eq2Lfg.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Eq2Lfg.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Eq2Lfg.Core.Tests --configuration Release --no-build --verbosity normal
