# Security-only mode: open-pull-requests-limit: 0 disables routine version-update
# PRs while keeping this config as the grouping/settings source. Dependabot still
# opens PRs automatically for SECURITY advisories (enabled in repo settings),
# which is the only time we want it to act.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      nuget:
        patterns: ["*"]
